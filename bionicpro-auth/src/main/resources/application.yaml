spring:
  application:
    name: auth-api
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: auth-api-client
            client-secret: auth-api-secret-1234567890
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            client-name: Keycloak
        provider:
          keycloak:
            issuer-uri: http://localhost:8080/realms/reports-realm
            user-name-attribute: preferred_username
  
  session:
    redis:
      namespace: auth-api:sessions
    timeout: 1800  # 30 минут - больше чем access token (2 минуты)
  
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8081
  servlet:
    session:
      cookie:
        http-only: true
        secure: false  # для localhost development
        name: AUTH_SESSION_ID
        max-age: 1800  # 30 минут

auth:
  session:
    rotation:
      enabled: true
      interval: 10  # ротация каждые 10 запросов
    encryption:
      password: "encryption-password-123"
      salt: "salt-value-456"

keycloak:
  auth-server-url: http://localhost:8080
  realm: reports-realm
  resource: auth-api-client
  credentials:
    secret: auth-api-secret-1234567890
  ssl-required: none
  confidential-port: 0

logging:
  level:
    org.springframework.security: DEBUG
    ru.artem.papyan.auth: DEBUG